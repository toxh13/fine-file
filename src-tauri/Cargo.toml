[package]
name = "fine-file"
version = "0.8.0"
description = "Fast Windows file explorer with folder sizes and instant search"
authors = ["toxh13"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/toxh13/fine-file"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fine_file_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "5"
png = "0.17"
encoding_rs = "0.8"
base64 = "0.22"
blake3 = "1"
tauri-plugin-drag = "2.1.1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
# In-app updates (Updater.tsx): signed releases from GitHub, installed only when the user says so.
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
# COM interfaces (shell thumbnails, the Explorer context menu) need the full bindings; everything else uses windows-sys.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic inside a command (spawn_blocking) then comes back
# to the UI as an error instead of closing the window without a word.
panic = "unwind"
strip = true
